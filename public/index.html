<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>DooDChat</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <!-- ====== 背景粒子层 ====== -->
  <div id="bg-effects" aria-hidden="true"></div>

  <!-- ====== 登录界面 ====== -->
  <div id="login-container">
    <!-- 雨滴与闪电效果；纯装饰，不进入无障碍树 -->
    <canvas id="rain-canvas" aria-hidden="true"></canvas>
    <div id="lightning-flash" aria-hidden="true"></div>

    <!-- 雾气流动层 -->
    <div class="mist-layer" aria-hidden="true"></div>
    <div class="mist-layer-2" aria-hidden="true"></div>

    <!-- 登录卡片 — 磨砂玻璃 -->
    <div class="login-box">
      <div class="login-glass"></div>
      <div class="login-content">
        <div class="login-logo">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            <path d="M8 10h.01M12 10h.01M16 10h.01" stroke-width="2" />
          </svg>
        </div>
        <h1>DooDChat</h1>
        <p class="login-subtitle">多人实时语音聊天室</p>
        <div class="login-input-wrap">
          <input id="nickname-input" type="text" placeholder="输入你的昵称" maxlength="20" autocomplete="nickname" autofocus>
        </div>
        <div id="room-password-wrap" class="login-input-wrap" style="display:none">
          <input id="room-password-input" type="password" placeholder="输入房间密码" maxlength="256" autocomplete="current-password">
        </div>
        <button id="join-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <line x1="19" y1="8" x2="19" y2="14" />
            <line x1="22" y1="11" x2="16" y2="11" />
          </svg>
          进入聊天室
        </button>
        <p id="login-error" class="error-msg"></p>
      </div>
    </div>
  </div>

  <!-- ====== 聊天界面 ====== -->
  <div id="chat-container" style="display:none">
    <!-- 顶部栏 -->
    <header id="chat-header">
      <div class="header-left">
        <button id="music-toggle" class="mobile-panel-toggle" aria-label="打开音乐面板" aria-controls="music-panel" aria-expanded="false">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13" />
            <circle cx="6" cy="18" r="3" />
            <circle cx="18" cy="16" r="3" />
          </svg>
        </button>
        <button id="sidebar-toggle" class="mobile-panel-toggle" aria-label="打开成员面板" aria-controls="side-panel" aria-expanded="false">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="8.5" cy="7" r="4" />
            <path d="M20 8v6M23 11h-6" />
          </svg>
        </button>
        <svg class="channel-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9h16" />
          <path d="M4 15h16" />
          <path d="M10 3L8 21" />
          <path d="M16 3l-2 18" />
        </svg>
        <h2>通用聊天室</h2>
        <span class="separator">|</span>
        <span id="online-count" class="online-count">0 人在线</span>
      </div>
      <div id="lyrics-display" class="header-mid" aria-live="off"></div>
      <div class="header-right">
        <button id="weather-btn" class="weather-btn" type="button" aria-label="切换房间天气" aria-haspopup="menu" aria-expanded="false">🌧️</button>
        <div class="theme-selector">
          <button class="theme-btn" data-theme="default" title="赛博紫" aria-label="赛博紫主题"></button>
          <button class="theme-btn" data-theme="green" title="霓虹绿" aria-label="霓虹绿主题"></button>
          <button class="theme-btn" data-theme="blue" title="深海蓝" aria-label="深海蓝主题"></button>
          <button class="theme-btn" data-theme="orange" title="赛博橙" aria-label="赛博橙主题"></button>
        </div>
        <div class="user-badge">
          <span class="status-indicator offline" aria-hidden="true"></span>
          <span class="user-badge-text">
            <span id="my-nickname-display"></span>
            <span id="connection-status-text" class="connection-status-text" role="status">离线</span>
          </span>
        </div>
      </div>
    </header>

    <div id="main-area">
      <!-- 音乐面板 -->
      <aside id="music-panel">
        <div class="panel-section" id="music-section">
          <h3 class="panel-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18V5l12-2v13" />
              <circle cx="6" cy="18" r="3" />
              <circle cx="18" cy="16" r="3" />
            </svg>
            音乐播放器
          </h3>

          <!-- 分享输入 -->
          <div id="music-share-area">
            <div class="music-input-row">
              <input id="music-url-input" type="text" placeholder="粘贴网易云歌单链接..." maxlength="200">
              <button id="music-share-btn" class="music-btn-small">分享</button>
            </div>
          </div>

          <!-- 当前播放 -->
          <div id="music-now-playing" style="display:none">
            <div class="music-now-info">
              <img id="music-cover" class="music-cover" src="" alt="封面">
              <div class="music-now-text">
                <div id="music-song-name" class="music-song-name"></div>
                <div id="music-artist" class="music-artist"></div>
              </div>
            </div>

            <!-- 进度条 -->
            <div class="music-progress-bar">
              <div class="music-progress-track">
                <div class="music-progress-fill" id="music-progress-fill"></div>
              </div>
              <div class="music-time-row">
                <span id="music-time-current">00:00</span>
                <span id="music-time-total">00:00</span>
              </div>
            </div>

            <!-- 控制 -->
            <div class="music-controls">
              <button id="music-prev-btn" class="music-btn" aria-label="上一首">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M19 20L9 12l10-8v16zM5 19V5h2v14H5z" />
                </svg>
              </button>
              <button id="music-play-pause-btn" class="music-btn music-btn-play" aria-label="播放/暂停">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M8 5v14l11-7z" />
                </svg>
              </button>
              <button id="music-next-btn" class="music-btn" aria-label="下一首">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M5 4l10 8-10 8V4zM19 5v14h-2V5h2z" />
                </svg>
              </button>
            </div>

            <!-- 音量 -->
            <div class="music-volume-row">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" />
              </svg>
              <input type="range" id="music-volume-slider" min="0" max="1" step="0.05" value="0.8">
            </div>
          </div>

          <!-- 歌曲列表 -->
          <div id="music-song-list" class="music-song-list" style="display:none">
            <div id="music-song-items"></div>
          </div>

          <!-- 空状态 -->
          <div id="music-empty-state" class="music-empty">
            <p>分享网易云歌单，一起听歌</p>
          </div>
        </div>
      </aside>

      <!-- 消息列表 -->
      <div id="message-list" role="log" aria-live="polite"></div>

      <!-- 移动端侧栏遮罩 -->
      <div id="sidebar-overlay" class="sidebar-overlay"></div>

      <!-- 右侧面板 -->
      <aside id="side-panel">
        <!-- 在线用户 -->
        <div class="panel-section">
          <h3 class="panel-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            在线用户
            <span id="online-badge" class="badge">0</span>
          </h3>
          <ul id="user-list"></ul>
        </div>

        <!-- 移动端主题选择 -->
        <div class="panel-section mobile-theme-section">
          <h3 class="panel-title">界面主题</h3>
          <div class="mobile-theme-selector" aria-label="选择界面主题">
            <button class="theme-btn mobile-theme-btn" data-theme="default" title="赛博紫" aria-label="赛博紫主题"></button>
            <button class="theme-btn mobile-theme-btn" data-theme="green" title="霓虹绿" aria-label="霓虹绿主题"></button>
            <button class="theme-btn mobile-theme-btn" data-theme="blue" title="深海蓝" aria-label="深海蓝主题"></button>
            <button class="theme-btn mobile-theme-btn" data-theme="orange" title="赛博橙" aria-label="赛博橙主题"></button>
          </div>
        </div>

        <!-- 浏览器通知（只在用户主动点击后请求权限） -->
        <div class="panel-section notification-section">
          <h3 class="panel-title">消息提醒</h3>
          <button id="notification-toggle-btn" class="settings-btn" type="button">开启 @ 提醒</button>
          <p id="notification-status" class="setting-hint" aria-live="polite">仅在页面处于后台且有人提到你时通知</p>
        </div>

        <!-- 语音频道 -->
        <div class="panel-section">
          <h3 class="panel-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
              <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
              <line x1="12" y1="19" x2="12" y2="23" />
              <line x1="8" y1="23" x2="16" y2="23" />
            </svg>
            语音频道
          </h3>
          <button id="voice-toggle-btn" class="voice-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
              <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            </svg>
            <span>加入语音</span>
          </button>
          <div id="voice-status" class="voice-status" style="display:none">
            <span class="voice-dot"></span>
            已连接语音
          </div>
          <ul id="voice-user-list"></ul>
        </div>
      </aside>
    </div>

    <!-- 回到最新消息 -->
    <button id="scroll-bottom-btn" type="button" aria-label="回到底部" title="回到底部">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>

    <!-- 对方正在输入 -->
    <div id="typing-indicator" class="typing-indicator" hidden aria-live="polite"></div>

    <!-- 底部输入 -->
    <div id="input-area">
      <div id="reply-preview" class="reply-preview" hidden aria-live="polite">
        <div class="reply-preview-copy">
          <span class="reply-preview-label">回复 <strong id="reply-preview-user"></strong></span>
          <span id="reply-preview-text" class="reply-preview-text"></span>
        </div>
        <button id="reply-preview-close" class="reply-preview-close" type="button" aria-label="取消回复">×</button>
      </div>
      <div class="input-wrapper">
        <textarea id="message-input" placeholder="输入消息…（回车发送，Shift+Enter 换行，@ 可呼出补全）" rows="1" maxlength="500"></textarea>
        <input id="image-file-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
        <button id="image-upload-btn" class="input-action-btn" type="button" aria-label="选择图片" title="选择图片">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <circle cx="8.5" cy="8.5" r="1.5" />
            <path d="M21 15l-5-5L5 21" />
          </svg>
        </button>
        <button id="emoji-btn" class="emoji-trigger input-action-btn" type="button" aria-label="表情">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <path d="M8 14s1.5 2 4 2 4-2 4-2" />
            <line x1="9" y1="9" x2="9.01" y2="9" />
            <line x1="15" y1="9" x2="15.01" y2="9" />
          </svg>
        </button>
        <span id="char-counter" class="char-counter" aria-live="off">500</span>
        <button id="send-btn" type="button" aria-label="发送">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 10 4 15 9 20"></polyline>
            <path d="M20 4v7a4 4 0 0 1-4 4H4"></path>
          </svg>
        </button>
      </div>
      <div id="mention-popup" class="mention-popup" hidden role="listbox" aria-label="选择要提及的成员"></div>
      <!-- Emoji 面板 -->
      <div id="emoji-panel" class="emoji-panel" style="display:none"></div>
    </div>
  </div>

  <!-- 全窗口拖入图片提示层（纯装饰，不进入无障碍树） -->
  <div id="drop-overlay" aria-hidden="true">
    <div class="drop-overlay-card">📷 松开即发送图片</div>
  </div>

  <!-- 图片查看器 -->
  <div id="image-lightbox" class="image-lightbox" hidden role="dialog" aria-modal="true" aria-label="查看聊天图片">
    <button id="image-lightbox-close" class="image-lightbox-close" type="button" aria-label="关闭图片查看器">×</button>
    <img id="image-lightbox-img" src="" alt="聊天图片大图">
  </div>

  <!-- ====== 脚本 ====== -->
  <script src="/js/voice.js"></script>
  <script src="/js/music.js"></script>
  <script src="/js/polish.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/rain.js"></script>
</body>

</html>
